{% extends "base.html" %}

{% block content %}
    <div class="container mt-5">
        <h1>¿Estás seguro de que deseas eliminar este comentario?</h1>
        <form method="POST">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Eliminar</button>
            <a href="{% url 'article_list' %}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
{% endblock %}
